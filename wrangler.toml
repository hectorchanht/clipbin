# Clipbin — Cloudflare Pages project config.
# Declares the Functions bindings in code so dashboard-set bindings
# survive future git-triggered deploys.
name = "clipbin"
compatibility_date = "2025-06-01"

# Required for Pages: without this the Pages CI ignores wrangler.toml entirely
# ("Skipping file and continuing") and the bindings below would not apply.
pages_build_output_dir = "build"

[[d1_databases]]
binding = "DB"
database_name = "clipbin-db"
database_id = "0c70722d-d313-4811-8f2d-9e5cb1e65ade"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "clipbin-images"
